<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" role="img"><title>遗器不确定性的两个阶段</title><desc>普通副本获取时，套装部位、主属性、副属性和强化分配逐层影响结果。定向合成可缩小获取阶段的不确定性，不能保证强化命中。</desc><rect width="1200" height="490" fill="#fff"/><text x="36" y="35" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#172033">普通副本路径：不确定性在哪里？</text><rect x="30" y="108" width="250" height="120" rx="12" fill="#f6f7fa" stroke="#d1d9e6"/><text x="155.0" y="143" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#172033">套装与部位</text><text x="155.0" y="188" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#475569">是否适合目标构筑</text><polyline points="283,168 319,168" fill="none" stroke="#7b8aa4" stroke-width="2.4" stroke-linejoin="round"/><polygon points="319,168 308.60769515458674,174.0 308.60769515458674,162.0" fill="#7b8aa4"/><rect x="326" y="108" width="250" height="120" rx="12" fill="#f6f7fa" stroke="#d1d9e6"/><text x="451.0" y="143" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#172033">主属性</text><text x="451.0" y="188" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#475569">是否满足基础需求</text><polyline points="579,168 615,168" fill="none" stroke="#7b8aa4" stroke-width="2.4" stroke-linejoin="round"/><polygon points="615,168 604.6076951545867,174.0 604.6076951545867,162.0" fill="#7b8aa4"/><rect x="622" y="108" width="250" height="120" rx="12" fill="#f6f7fa" stroke="#d1d9e6"/><text x="747.0" y="143" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#172033">副属性</text><text x="747.0" y="188" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#475569">是否已有目标属性</text><polyline points="875,168 911,168" fill="none" stroke="#7b8aa4" stroke-width="2.4" stroke-linejoin="round"/><polygon points="911,168 900.6076951545867,174.0 900.6076951545867,162.0" fill="#7b8aa4"/><rect x="918" y="108" width="250" height="120" rx="12" fill="#eef4ff" stroke="#d1d9e6"/><text x="1043.0" y="143" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#172033">强化分配</text><text x="1043.0" y="188" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#475569">是否命中有效属性</text><polyline points="42,252 42,280 857,280 857,252" fill="none" stroke="#7b8aa4" stroke-width="2.4" stroke-linejoin="round"/><text x="450" y="323" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" fill="#172033">获取阶段 · 定向合成可缩小随机范围</text><text x="1043" y="287" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#2454b8">强化阶段</text><text x="1043" y="330" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#2454b8">仍有不确定性</text><text x="600" y="419" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" fill="#475569">“可用”标准随角色、队伍和玩法目标变化</text></svg>