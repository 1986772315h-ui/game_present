<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1000" role="img"><title>遗器不确定性的两个阶段</title><desc>普通副本获取时，套装部位、主属性、副属性和强化分配逐层影响结果。定向合成可缩小获取阶段的不确定性，不能保证强化命中。</desc><rect width="640" height="1000" fill="#fff"/><text x="36" y="35" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#172033">普通副本路径：不确定性在哪里？</text><rect x="70" y="100" width="500" height="120" rx="12" fill="#f6f7fa" stroke="#d1d9e6"/><text x="320.0" y="135" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#172033">套装与部位</text><text x="320.0" y="180" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#475569">是否适合目标构筑</text><polyline points="320,223 320,256" fill="none" stroke="#7b8aa4" stroke-width="2.4" stroke-linejoin="round"/><polygon points="320,256 314.0,245.60769515458674 326.0,245.60769515458674" fill="#7b8aa4"/><rect x="70" y="260" width="500" height="120" rx="12" fill="#f6f7fa" stroke="#d1d9e6"/><text x="320.0" y="295" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#172033">主属性</text><text x="320.0" y="340" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#475569">是否满足基础需求</text><polyline points="320,383 320,416" fill="none" stroke="#7b8aa4" stroke-width="2.4" stroke-linejoin="round"/><polygon points="320,416 314.0,405.60769515458674 326.0,405.60769515458674" fill="#7b8aa4"/><rect x="70" y="420" width="500" height="120" rx="12" fill="#f6f7fa" stroke="#d1d9e6"/><text x="320.0" y="455" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#172033">副属性</text><text x="320.0" y="500" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#475569">是否已有目标属性</text><polyline points="320,543 320,576" fill="none" stroke="#7b8aa4" stroke-width="2.4" stroke-linejoin="round"/><polygon points="320,576 314.0,565.6076951545867 326.0,565.6076951545867" fill="#7b8aa4"/><rect x="70" y="580" width="500" height="120" rx="12" fill="#eef4ff" stroke="#d1d9e6"/><text x="320.0" y="615" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#172033">强化分配</text><text x="320.0" y="660" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#475569">是否命中有效属性</text><text x="320" y="795" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#172033">获取阶段：定向合成可缩小随机范围</text><text x="320" y="846" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#2454b8">强化阶段：仍需面对成长分配的不确定性</text><text x="320" y="928" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#475569">“可用”标准随角色、队伍和玩法目标变化</text></svg>