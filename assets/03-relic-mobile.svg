<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 718" role="img"><title>遗器不确定性的两个阶段</title><desc>获取阶段可以通过定向合成缩小随机范围，强化阶段仍有分配的不确定性。</desc><rect width="360" height="718" fill="#fff"/><text x="20" y="28" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172033">普通副本：不确定性在哪里？</text><rect x="20" y="62" width="320" height="84" rx="12" fill="#f6f7fa" stroke="#d1d9e6"/><text x="180.0" y="87.2" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172033">套装与部位</text><text x="180.0" y="119.12" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#475569">是否适合目标构筑</text><polyline points="180,148 180,171" fill="none" stroke="#7b8aa4" stroke-width="2.4" stroke-linejoin="round"/><polygon points="180,171 174.0,160.60769515458674 186.0,160.60769515458674" fill="#7b8aa4"/><rect x="20" y="174" width="320" height="84" rx="12" fill="#f6f7fa" stroke="#d1d9e6"/><text x="180.0" y="199.2" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172033">主属性</text><text x="180.0" y="231.12" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#475569">是否满足基础需求</text><polyline points="180,260 180,283" fill="none" stroke="#7b8aa4" stroke-width="2.4" stroke-linejoin="round"/><polygon points="180,283 174.0,272.60769515458674 186.0,272.60769515458674" fill="#7b8aa4"/><rect x="20" y="286" width="320" height="84" rx="12" fill="#f6f7fa" stroke="#d1d9e6"/><text x="180.0" y="311.2" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172033">副属性</text><text x="180.0" y="343.12" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#475569">是否已有目标属性</text><polyline points="180,372 180,395" fill="none" stroke="#7b8aa4" stroke-width="2.4" stroke-linejoin="round"/><polygon points="180,395 174.0,384.60769515458674 186.0,384.60769515458674" fill="#7b8aa4"/><rect x="20" y="398" width="320" height="84" rx="12" fill="#eef4ff" stroke="#d1d9e6"/><text x="180.0" y="423.2" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172033">强化分配</text><text x="180.0" y="455.12" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#475569">是否命中有效属性</text><text x="180" y="525" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#172033">获取阶段 · 定向合成</text><text x="180" y="555" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#475569">缩小获取目标胚子的随机范围</text><text x="180" y="603" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#2454b8">强化阶段 · 分配仍有随机性</text><text x="180" y="660" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#475569">“可用”标准随角色、队伍</text><text x="180" y="689" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#475569">与玩法目标变化</text></svg>