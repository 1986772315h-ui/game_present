<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 755" role="img"><title>共享资源产生团队取舍</title><desc>同样只有一点战技点，辅助普攻与辅助战技形成不同的机会成本；两条路径最终均剩一点。</desc><rect width="360" height="755" fill="#fff"/><text x="20" y="28" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172033">相同起点，不同机会成本</text><text x="180" y="65" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#2454b8">路径 A · 为主输出保留资源</text><rect x="20" y="89" width="320" height="68" rx="12" fill="#f6f7fa" stroke="#d1d9e6"/><text x="180.0" y="123.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172033">初始 1 点</text><polyline points="180,159 180,177" fill="none" stroke="#7b8aa4" stroke-width="2.4" stroke-linejoin="round"/><polygon points="180,177 174.0,166.60769515458674 186.0,166.60769515458674" fill="#7b8aa4"/><rect x="20" y="180" width="320" height="68" rx="12" fill="#f6f7fa" stroke="#d1d9e6"/><text x="180.0" y="200.4" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172033">辅助普攻 +1</text><text x="180.0" y="226.24" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#475569">剩余 2 点</text><polyline points="180,250 180,268" fill="none" stroke="#7b8aa4" stroke-width="2.4" stroke-linejoin="round"/><polygon points="180,268 174.0,257.60769515458674 186.0,257.60769515458674" fill="#7b8aa4"/><rect x="20" y="271" width="320" height="68" rx="12" fill="#eef4ff" stroke="#d1d9e6"/><text x="180.0" y="291.4" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172033">主输出战技 −1</text><text x="180.0" y="317.24" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#475569">最终剩余 1 点</text><text x="180" y="386" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#2454b8">路径 B · 先取得辅助战技效果</text><rect x="20" y="410" width="320" height="68" rx="12" fill="#f6f7fa" stroke="#d1d9e6"/><text x="180.0" y="444.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172033">初始 1 点</text><polyline points="180,480 180,498" fill="none" stroke="#7b8aa4" stroke-width="2.4" stroke-linejoin="round"/><polygon points="180,498 174.0,487.60769515458674 186.0,487.60769515458674" fill="#7b8aa4"/><rect x="20" y="501" width="320" height="68" rx="12" fill="#f6f7fa" stroke="#d1d9e6"/><text x="180.0" y="521.4" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172033">辅助战技 −1</text><text x="180.0" y="547.24" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#475569">剩余 0 点</text><polyline points="180,571 180,589" fill="none" stroke="#7b8aa4" stroke-width="2.4" stroke-linejoin="round"/><polygon points="180,589 174.0,578.6076951545867 186.0,578.6076951545867" fill="#7b8aa4"/><rect x="20" y="592" width="320" height="68" rx="12" fill="#eef4ff" stroke="#d1d9e6"/><text x="180.0" y="612.4" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172033">主输出普攻 +1</text><text x="180.0" y="638.24" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#475569">最终剩余 1 点</text><text x="180" y="704" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#475569">简化情境，不含角色的</text><text x="180" y="731" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#475569">特殊产耗点机制</text></svg>