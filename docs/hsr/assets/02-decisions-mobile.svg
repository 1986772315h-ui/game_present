<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1110" role="img"><title>共享资源产生团队取舍</title><desc>只有一点战技点时，辅助普攻可为主输出保留战技机会；辅助先用战技则会挤占此机会。两个示例最终都剩一点。</desc><rect width="640" height="1110" fill="#fff"/><text x="36" y="35" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#172033">相同起点，不同机会成本</text><text x="320" y="90" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#2454b8">路径 A · 为主输出保留资源</text><rect x="70" y="125" width="500" height="100" rx="12" fill="#f6f7fa" stroke="#d1d9e6"/><text x="320.0" y="175.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#172033">初始 1 点</text><polyline points="320,228 320,251" fill="none" stroke="#7b8aa4" stroke-width="2.4" stroke-linejoin="round"/><polygon points="320,251 314.0,240.60769515458674 326.0,240.60769515458674" fill="#7b8aa4"/><rect x="70" y="255" width="500" height="100" rx="12" fill="#f6f7fa" stroke="#d1d9e6"/><text x="320.0" y="290" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#172033">辅助普攻 +1</text><text x="320.0" y="335" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#475569">剩余 2 点</text><polyline points="320,358 320,381" fill="none" stroke="#7b8aa4" stroke-width="2.4" stroke-linejoin="round"/><polygon points="320,381 314.0,370.60769515458674 326.0,370.60769515458674" fill="#7b8aa4"/><rect x="70" y="385" width="500" height="100" rx="12" fill="#eef4ff" stroke="#d1d9e6"/><text x="320.0" y="420" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#172033">主输出战技 −1</text><text x="320.0" y="465" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#475569">最终剩余 1 点</text><text x="320" y="570" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#2454b8">路径 B · 先取得辅助战技效果</text><rect x="70" y="605" width="500" height="100" rx="12" fill="#f6f7fa" stroke="#d1d9e6"/><text x="320.0" y="655.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#172033">初始 1 点</text><polyline points="320,708 320,731" fill="none" stroke="#7b8aa4" stroke-width="2.4" stroke-linejoin="round"/><polygon points="320,731 314.0,720.6076951545867 326.0,720.6076951545867" fill="#7b8aa4"/><rect x="70" y="735" width="500" height="100" rx="12" fill="#f6f7fa" stroke="#d1d9e6"/><text x="320.0" y="770" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#172033">辅助战技 −1</text><text x="320.0" y="815" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#475569">剩余 0 点</text><polyline points="320,838 320,861" fill="none" stroke="#7b8aa4" stroke-width="2.4" stroke-linejoin="round"/><polygon points="320,861 314.0,850.6076951545867 326.0,850.6076951545867" fill="#7b8aa4"/><rect x="70" y="865" width="500" height="100" rx="12" fill="#eef4ff" stroke="#d1d9e6"/><text x="320.0" y="900" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#172033">主输出普攻 +1</text><text x="320.0" y="945" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#475569">最终剩余 1 点</text><text x="320" y="1055" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#475569">简化情境，不含角色的特殊产耗点机制</text></svg>