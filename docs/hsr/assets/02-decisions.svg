<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" role="img"><title>共享资源产生团队取舍</title><desc>只有一点战技点时，辅助普攻可为主输出保留战技机会；辅助先用战技则会挤占此机会。两个示例最终都剩一点。</desc><rect width="1200" height="530" fill="#fff"/><text x="36" y="35" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#172033">相同起点，不同机会成本</text><text x="35" y="80" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#2454b8">路径 A · 为主输出保留资源</text><rect x="35" y="105" width="335" height="115" rx="12" fill="#f6f7fa" stroke="#d1d9e6"/><text x="202.5" y="162.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#172033">初始 1 点</text><rect x="427" y="105" width="335" height="115" rx="12" fill="#f6f7fa" stroke="#d1d9e6"/><text x="594.5" y="139.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#172033">辅助普攻 +1</text><text x="594.5" y="183.2" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#475569">剩余 2 点</text><rect x="819" y="105" width="335" height="115" rx="12" fill="#eef4ff" stroke="#d1d9e6"/><text x="986.5" y="139.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#172033">主输出战技 −1</text><text x="986.5" y="183.2" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#475569">最终剩余 1 点</text><polyline points="375,162 420,162" fill="none" stroke="#7b8aa4" stroke-width="2.4" stroke-linejoin="round"/><polygon points="420,162 409.60769515458674,168.0 409.60769515458674,156.0" fill="#7b8aa4"/><polyline points="767,162 812,162" fill="none" stroke="#7b8aa4" stroke-width="2.4" stroke-linejoin="round"/><polygon points="812,162 801.6076951545867,168.0 801.6076951545867,156.0" fill="#7b8aa4"/><text x="35" y="265" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#2454b8">路径 B · 先取得辅助战技效果</text><rect x="35" y="290" width="335" height="115" rx="12" fill="#f6f7fa" stroke="#d1d9e6"/><text x="202.5" y="347.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#172033">初始 1 点</text><rect x="427" y="290" width="335" height="115" rx="12" fill="#f6f7fa" stroke="#d1d9e6"/><text x="594.5" y="324.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#172033">辅助战技 −1</text><text x="594.5" y="368.2" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#475569">剩余 0 点</text><rect x="819" y="290" width="335" height="115" rx="12" fill="#eef4ff" stroke="#d1d9e6"/><text x="986.5" y="324.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#172033">主输出普攻 +1</text><text x="986.5" y="368.2" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#475569">最终剩余 1 点</text><polyline points="375,347 420,347" fill="none" stroke="#7b8aa4" stroke-width="2.4" stroke-linejoin="round"/><polygon points="420,347 409.60769515458674,353.0 409.60769515458674,341.0" fill="#7b8aa4"/><polyline points="767,347 812,347" fill="none" stroke="#7b8aa4" stroke-width="2.4" stroke-linejoin="round"/><polygon points="812,347 801.6076951545867,353.0 801.6076951545867,341.0" fill="#7b8aa4"/><text x="35" y="476" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#475569">简化情境，不含角色的特殊产耗点机制；路径优劣取决于当前目标。</text></svg>